spring:
  application:
    name: identity-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3309/identity-service}
    username: ${DB_username:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:RedisPass123}
      database: 0
      timeout: 60000

logging:
  level:
    root: INFO
    com.quyet.identity: INFO
  file:
    name: logs/identity-service.log
    logback:
      rollingpolicy:
        file-name-pattern: logs/identity-service.%d{yyyy-MM-dd}.%i.log
        max-file-size: 10MB
        max-history: 30
        total-size-cap: 100MB



server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/identity}

app-config:
  origin-pattern: ${ORIGIN_PATTERN:http://localhost:3000}
