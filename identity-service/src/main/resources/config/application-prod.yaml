spring:
  application:
    name: identity-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/identity-service}
    username: ${DB_username:root}
    password: ${DB_PASSWORD:12356789}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:"/identity"}
